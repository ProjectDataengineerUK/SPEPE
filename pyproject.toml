[project]
name = "spepe"
version = "0.1.0"
description = "Sistema de Perfilamento do Eleitorado e Previsão Eleitoral — Multi-Agente com Claude SDK"
requires-python = ">=3.12"

dependencies = [
    # Core — Claude Agent SDK
    "claude-agent-sdk>=0.1.48",

    # Analytics local
    "duckdb>=0.10",

    # Modelagem bayesiana (MVP)
    "statsmodels>=0.14",
    "numpy>=1.26",
    "scipy>=1.12",

    # Data
    "pandas>=2.0",
    "pyarrow>=15.0",
    "requests>=2.31",

    # Configuração
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",

    # Output formatado
    "rich>=13.0",

    # Export de conversas
    "markdown2>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.7",
]
monitoring = [
    "streamlit>=1.35",
    "pyyaml>=6.0",
]
ui = [
    "streamlit>=1.35",
    "chainlit>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
spepe = "main:main"
spepe-tse-mcp = "mcp_servers.tse.server:main"
spepe-ibge-mcp = "mcp_servers.ibge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.sdist]
include = [
    "/config",
    "/agents",
    "/mcp_servers",
    "/hooks",
    "/commands",
    "/skills",
    "/kb",
    "/memory",
    "/ui",
    "/monitoring",
    "/tests",
    "/main.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["skills/", "kb/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = false
warn_return_any = false
disable_error_codes = ["attr-defined", "union-attr"]

[[tool.mypy.overrides]]
module = [
    "claude_agent_sdk.*",
    "rich.*",
    "duckdb.*",
    "statsmodels.*",
    "pydantic_settings.*",
    "requests.*",
    "yaml",
    "chainlit.*",
    "pyarrow.*",
    "pandas.*",
    "numpy.*",
    "scipy.*",
    "sklearn.*",
    "hdbscan.*",
    "umap.*",
    "shap.*",
    "pymc.*",
    "pytensor.*",
    "kfp.*",
    "vertexai.*",
    "folium.*",
    "geopandas.*",
    "plotly.*",
    "pytrends.*",
]
ignore_missing_imports = true
