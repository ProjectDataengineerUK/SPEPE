archetype:
  hdbscan:
    min_cluster_size: 30
    min_samples: 5
    metric: euclidean
    cluster_selection_method: eom
  kmeans_fallback:
    n_clusters: 8
    n_init: 10
    max_iter: 300
    random_state: 42
  gmm:
    n_components: 8
    covariance_type: full
    random_state: 42
  silhouette_threshold: 0.45        # Below → K-means fallback + warning
  umap:
    n_components: 2
    n_neighbors: 15
    min_dist: 0.1
    metric: euclidean
    random_state: 42
  pca_variance_threshold: 0.95      # Keep components explaining 95% variance
  label_model: claude-haiku-4-5-20251001
  cache_dir: output/cache/archetype

bootstrap:
  n_bootstrap: 1000
  confidence_level: 0.95
  min_samples_warning: 100          # Doubles n_bootstrap if below this
  random_state: 42
  test_size: 0.2

pymc:
  draws: 2000
  tune: 1000
  chains: 4
  target_accept: 0.9
  r_hat_max: 1.05
  ess_bulk_min: 400
  random_seed: 42

poll_aggregator:
  decay_lambda_days: 30             # Recency weight: exp(-days_ago / lambda)
  confidence_z: 1.96                # 95% CI

drift_detection:
  js_divergence_threshold: 0.10
  categorical_threshold: 0.05
  sample_rate: 0.10
  check_features:
    - idhm_2010
    - renda_media_domiciliar
    - pct_zona_rural
    - qt_votos_validos_2022

vertex_pipeline:
  pipeline_name: spepe-ml-pipeline
  service_account_suffix: spepe-vertex-pipeline
  enable_caching: true
  failure_policy: fail-fast

mlflow_experiment: spepe-archetypes
champion_model_path: output/models/champion.pkl
champion_meta_path: output/models/champion_meta.json
