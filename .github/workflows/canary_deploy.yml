name: Canary Deploy

on:
  workflow_dispatch:
    inputs:
      challenger_image:
        description: "Challenger image tag (e.g. southamerica-east1-docker.pkg.dev/project/spepe/app:sha)"
        required: true
      eval_hours:
        description: "Canary evaluation window in hours (max 5 — GH Actions job limit)"
        required: false
        default: "4"

env:
  GCP_REGION: southamerica-east1

jobs:
  start-canary:
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      champion_revision: ${{ steps.canary.outputs.champion_revision }}
    permissions:
      contents: read
      id-token: write
    # Sanity-check the eval window — GitHub Actions jobs time out at 6 hours
    steps:
      - name: Validate eval_hours
        run: |
          HOURS="${{ github.event.inputs.eval_hours }}"
          if [ "${HOURS}" -gt 5 ]; then
            echo "ERROR: eval_hours=${HOURS} exceeds the 5-hour safety limit."
            echo "For longer canary windows, use the canary_manager.py script"
            echo "directly from a long-running VM or Cloud Run Job instead."
            exit 1
          fi

      - uses: actions/checkout@v4

      # OIDC-based auth — eliminates long-lived SA key stored as a secret
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: canary
        name: Deploy challenger revision and split traffic 10% / 90%
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
          BIGQUERY_DATASET_SILVER: spepe_silver
          BIGQUERY_DATASET_GOLD: spepe_gold
        run: |
          python - <<'EOF'
          import os, subprocess
          from mlops.deployment.canary_manager import start_canary

          service = "spepe-prod"
          challenger = "${{ github.event.inputs.challenger_image }}"
          project = os.environ["GCP_PROJECT_ID"]
          region = "${{ env.GCP_REGION }}"

          # Deploy challenger as a new tagged revision — no traffic yet
          subprocess.run([
            "gcloud", "run", "deploy", service,
            "--image", challenger,
            "--region", region,
            "--project", project,
            "--no-traffic",
            "--tag", "challenger",
          ], check=True)

          # Capture the current champion revision name before splitting traffic
          result = subprocess.run([
            "gcloud", "run", "services", "describe", service,
            "--region", region,
            "--project", project,
            "--format", "value(status.traffic[0].revisionName)",
          ], check=True, capture_output=True, text=True)
          champion_revision = result.stdout.strip()

          # Split traffic: 10% challenger / 90% champion
          state = start_canary(
            service=service,
            challenger_revision="challenger",
            project_id=project,
            region=region,
          )
          print(f"Canary started. Champion: {champion_revision}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"champion_revision={champion_revision}\n")
          EOF

  watch-canary:
    runs-on: ubuntu-latest
    needs: start-canary
    environment: prod
    # Set job timeout slightly above eval_hours (in minutes) to avoid silent truncation
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # OIDC-based auth — eliminates long-lived SA key stored as a secret
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Watch canary and auto-promote or rollback
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BIGQUERY_DATASET_GOLD: spepe_gold
        run: |
          python - <<'EOF'
          import os, sys
          from mlops.deployment.canary_manager import CanaryState
          from mlops.deployment.auto_rollback import watch_canary

          state = CanaryState(
            service="spepe-prod",
            champion_revision="${{ needs.start-canary.outputs.champion_revision }}",
            challenger_revision="challenger",
            project_id=os.environ["GCP_PROJECT_ID"],
            region="${{ env.GCP_REGION }}",
          )

          outcome = watch_canary(state, max_hours=int("${{ github.event.inputs.eval_hours }}"))
          print(f"Canary outcome: {outcome}")

          if outcome == "rolled_back":
            print("Rollback complete — champion revision restored to 100% traffic.")
            # Exit 1 so the GitHub Actions run is marked as failed for visibility
            sys.exit(1)

          print("Canary promoted — challenger is now serving 100% of traffic.")
          EOF
