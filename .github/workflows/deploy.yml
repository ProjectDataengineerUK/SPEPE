name: Deploy

on:
  # Auto-deploy: triggered when CI passes on main
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  # Manual promotion to staging or prod
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, prod]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  GCP_REGION: southamerica-east1
  # Artifact Registry is the modern replacement for GCR (gcr.io is deprecated)
  IMAGE_REGISTRY: southamerica-east1-docker.pkg.dev

jobs:
  # Gate: only proceed when CI succeeded (for workflow_run trigger)
  check-ci:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: CI passed — proceeding with deployment
        run: echo "CI conclusion=${{ github.event.workflow_run.conclusion || 'manual-dispatch' }}"

  build-push:
    runs-on: ubuntu-latest
    needs: check-ci
    # Always build in staging env — one registry, one SA with AR write permissions
    environment: staging
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    permissions:
      contents: read
      # Required for Workload Identity Federation
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # OIDC-based auth — eliminates long-lived SA key stored as a secret
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.IMAGE_REGISTRY }}

      - id: meta
        name: Set image tag
        run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA::8}"
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          REGISTRY="${{ env.IMAGE_REGISTRY }}"
          TAG="${REGISTRY}/${PROJECT}/spepe/app:${SHORT}"
          echo "image_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-push
    # Always deploy to staging first, regardless of trigger
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run staging
        id: deploy
        run: |
          gcloud run deploy spepe-staging \
            --image "${{ needs.build-push.outputs.image_tag }}" \
            --service-account "spepe-cloud-run@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-env-vars "GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},USE_BIGQUERY=true,DEFAULT_UF=SP,DEFAULT_ANO=2022,ENVIRONMENT=staging,GOOGLE_CLIENT_ID=1055426323388-j97gohht800s7v447f2v8fg6lskacv37.apps.googleusercontent.com" \
            --set-secrets "ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest" \
            --allow-unauthenticated \
            --port 8080 \
            --memory 2Gi \
            --cpu 1 \
            --cpu-boost \
            --timeout 60 \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}"
          URL=$(gcloud run services describe spepe-staging \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --format "value(status.url)")
          echo "url=${URL}" >> $GITHUB_OUTPUT

      - name: Update Cloud Run Jobs to new image
        run: |
          IMAGE="${{ needs.build-push.outputs.image_tag }}"
          for JOB in spepe-tse-ingest spepe-tse-perfil-ingest spepe-tse-candidaturas-ingest \
                     spepe-ibge-sync spepe-digital-ingest spepe-silver-transform spepe-gold-build \
                     spepe-social-ingest spepe-pesquisas-ingest spepe-security-ingest spepe-datasus-ingest \
                     spepe-dieese-ingest spepe-cetic-ingest spepe-reddit-ingest spepe-camara-senado-ingest \
                     spepe-endividamento-ingest spepe-cadunico-ingest spepe-emendas-ingest \
                     spepe-sancoes-ingest spepe-candidatos-discovery spepe-pymc-train; do
            gcloud run jobs update "${JOB}" \
              --image "${IMAGE}" \
              --region "${{ env.GCP_REGION }}" \
              --project "${{ vars.GCP_PROJECT_ID }}" 2>&1 || echo "Warning: could not update ${JOB}"
          done

      - name: Smoke test — staging health check
        run: |
          echo "Service deployed to: ${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 9); do
            READY=$(gcloud run services describe spepe-staging \
              --region "${{ env.GCP_REGION }}" \
              --project "${{ vars.GCP_PROJECT_ID }}" \
              --format "value(status.conditions[0].status)" 2>/dev/null || echo "False")
            echo "Attempt ${i}: Cloud Run Ready=${READY}"
            if [ "${READY}" = "True" ]; then
              echo "Service is ready."
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test failed — service not ready after 90s"
          exit 1

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [build-push, deploy-staging]
    # Run when:
    #   - workflow_run (auto): CI passed on main → staging smoke test passed → promote to prod
    #   - workflow_dispatch with environment=prod: manual promotion
    # github.event.inputs is null for workflow_run, so the first condition covers auto triggers.
    if: >
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.environment == 'prod' || github.event.inputs.environment == 'staging'))
    # "production" environment requires manual approval in GitHub Settings → Environments.
    # Same WIF SA as staging — SA must have run.developer on spepe-prod.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run prod
        id: deploy
        run: |
          gcloud run deploy spepe-prod \
            --image "${{ needs.build-push.outputs.image_tag }}" \
            --service-account "spepe-cloud-run@spepe-prod.iam.gserviceaccount.com" \
            --set-env-vars "GCP_PROJECT_ID=spepe-prod,USE_BIGQUERY=true,DEFAULT_UF=SP,DEFAULT_ANO=2022,ENVIRONMENT=prod,GOOGLE_CLIENT_ID=1055426323388-j97gohht800s7v447f2v8fg6lskacv37.apps.googleusercontent.com" \
            --set-secrets "ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest" \
            --allow-unauthenticated \
            --port 8080 \
            --memory 2Gi \
            --cpu 1 \
            --cpu-boost \
            --timeout 60 \
            --region "${{ env.GCP_REGION }}" \
            --project spepe-prod

      - name: Update Cloud Run Jobs to new image
        run: |
          IMAGE="${{ needs.build-push.outputs.image_tag }}"
          REGION="${{ env.GCP_REGION }}"
          SA="spepe-dataops-jobs@spepe-prod.iam.gserviceaccount.com"
          for JOB in spepe-tse-ingest spepe-tse-perfil-ingest spepe-tse-candidaturas-ingest \
                     spepe-ibge-sync spepe-digital-ingest spepe-silver-transform spepe-gold-build \
                     spepe-social-ingest spepe-pesquisas-ingest spepe-security-ingest spepe-datasus-ingest \
                     spepe-dieese-ingest spepe-cetic-ingest spepe-reddit-ingest spepe-camara-senado-ingest \
                     spepe-endividamento-ingest spepe-cadunico-ingest spepe-emendas-ingest \
                     spepe-sancoes-ingest spepe-candidatos-discovery spepe-pymc-train; do
            MEM="512Mi"; CPU="1"; TIMEOUT="3600"
            if [ "${JOB}" = "spepe-pymc-train" ]; then MEM="4Gi"; CPU="2"; TIMEOUT="7200"; fi
            if gcloud run jobs describe "${JOB}" --region "${REGION}" --project spepe-prod &>/dev/null; then
              gcloud run jobs update "${JOB}" \
                --image "${IMAGE}" \
                --region "${REGION}" \
                --project spepe-prod 2>&1 || echo "Warning: could not update ${JOB}"
            else
              echo "Job ${JOB} not found — creating"
              gcloud run jobs create "${JOB}" \
                --image "${IMAGE}" \
                --region "${REGION}" \
                --service-account "${SA}" \
                --memory "${MEM}" --cpu "${CPU}" --task-timeout "${TIMEOUT}" \
                --project spepe-prod 2>&1 || echo "Warning: could not create ${JOB}"
            fi
          done

      - name: Smoke test — prod health check
        run: |
          REGION="${{ env.GCP_REGION }}"
          # Capture the stable revision before this deploy so we can roll back if needed
          PREV_REVISION=$(gcloud run services describe spepe-prod \
            --region "${REGION}" --project spepe-prod \
            --format "value(status.latestReadyRevisionName)" 2>/dev/null || echo "")
          echo "Previous stable revision: ${PREV_REVISION}"
          echo "Smoke test: checking spepe-prod service readiness"
          for i in $(seq 1 10); do
            READY=$(gcloud run services describe spepe-prod \
              --region "${REGION}" \
              --project spepe-prod \
              --format "value(status.conditions[0].status)" 2>/dev/null || echo "False")
            echo "Attempt ${i}: Cloud Run Ready=${READY}"
            if [ "${READY}" = "True" ]; then
              echo "Service is ready."
              exit 0
            fi
            sleep 15
          done
          echo "Smoke test failed — service not ready after 150s. Rolling back."
          if [ -n "${PREV_REVISION}" ]; then
            gcloud run services update-traffic spepe-prod \
              --to-revisions="${PREV_REVISION}=100" \
              --region="${REGION}" \
              --project=spepe-prod || true
            echo "Traffic restored to ${PREV_REVISION}"
          fi
          exit 1
