name: Security

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"  # Mondays at 06:00 UTC

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to upload SARIF results to GitHub Security tab
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          # Load into local Docker daemon for Trivy to scan — do not push
          load: true
          tags: spepe:scan
          # Reuse cache from deploy workflow to avoid a full rebuild
          cache-from: type=gha

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -q && sudo apt-get install -y trivy

      - name: Trivy image scan (table — for log visibility)
        run: |
          trivy image \
            --format table \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            spepe:scan || true

      - name: Trivy image scan (sarif — gate)
        run: |
          trivy image \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            spepe:scan

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        # Upload even when Trivy found vulnerabilities (exit-code 1 above)
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

  dlp-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Use requirements-app.txt (runtime deps only — no kfp/ML training libs)
      - run: pip install -r requirements-app.txt
      - name: Scan codebase for PII patterns
        run: PYTHONPATH=. python scripts/dlp_scan.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pip-audit
      # Audit deployed app deps (requirements-app.txt excludes kfp which has an
      # irresolvable urllib3 conflict with google-cloud-aiplatform)
      - run: pip install -r requirements-app.txt
      # CVE-2026-3219, CVE-2026-6357 are pip itself (runner-managed, not our dep)
      - run: pip-audit --ignore-vuln GHSA-w7pp-m8wf-vj6r --ignore-vuln GHSA-pqhp-25j4-6hq9 --ignore-vuln GHSA-g4mx-q9vg-27p4 --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357
